[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-classification"
version = "0.1.0"
description = "End-to-end heart disease classification, tuning, inference, and browser UI system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
heart-disease = "heart_disease.cli:main"
heart-train = "heart_disease.training:main"
heart-tune = "heart_disease.tuning:main"
heart-predict = "heart_disease.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
